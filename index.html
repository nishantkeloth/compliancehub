      body: JSON.stringify({ action, payload }),
    });
    const data = await r.json();
    if (!r.ok || data.error) return { error: data.error || "AI request failed" };
    return { text: data.text };
  } catch (e) {
    return { error: "Could not reach AI service. AI features only work on the deployed site, not a local file." };
  }
}
async function urlToBase64(url) {
  const resp = await fetch(url);
  const blob = await resp.blob();
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result.split(",")[1]);
    reader.readAsDataURL(blob);
  });
}

function route() {
  const hash = location.hash.slice(1) || "/";
  if (!state.user) { renderLogin(); return; }
  if (hash === "/") renderDashboard();
  else if (hash === "/templates") renderTemplates();
  else if (hash === "/actions") renderActions();
  else if (hash.startsWith("/inspection/")) renderInspection(hash.split("/")[2]);
  else renderDashboard();
}

async function renderDashboard() {
  shell("/", "Dashboard", "", `<div class="spinner-text">Loading…</div>`);
  const [{ data: templates }, { data: inspections }, { count: openActions }] = await Promise.all([
    sb.from("templates").select("id, code, name, revision, scoring_type").order("code"),
    sb.from("inspections").select("id, status, score_pct, started_at, submitted_at, template_id, site_id, templates(code,name), sites(name)").order("started_at",{ascending:false}).limit(60),
    sb.from("corrective_actions").select("id",{count:"exact",head:true}).in("status",["open","in_progress"]),
  ]);
  const list = inspections ?? [];
  const submitted = list.filter(i => i.status !== "in_progress");
  const avgScore = submitted.length ? Math.round(submitted.reduce((n,i)=>n+(i.score_pct||0),0)/submitted.length) : 0;

  // ---- 4. Risk trend (heuristic v1): per site+template, compare the two most recent scores ----
  const bySiteTpl = {};
  submitted.forEach(i => {
    const key = `${i.site_id}|${i.template_id}`;
    (bySiteTpl[key] ||= []).push(i);
  });
  const risks = [];
  Object.values(bySiteTpl).forEach(arr => {
    const sorted = [...arr].sort((a,b) => new Date(b.submitted_at) - new Date(a.submitted_at));
    if (sorted.length >= 2) {
      const [latest, prev] = sorted;
      const drop = (prev.score_pct||0) - (latest.score_pct||0);
      if (drop >= 10 || (latest.score_pct < 75 && prev.score_pct < 75)) {
        risks.push({ site: latest.sites?.name, template: latest.templates?.code, latest: Math.round(latest.score_pct), prev: Math.round(prev.score_pct), id: latest.id });
      }
    }
  });

  // ---- 7. Anomaly detection (heuristic v1): perfect/near-perfect score completed suspiciously fast ----
  const anomalies = submitted.filter(i => {
    if (!i.submitted_at || (i.score_pct||0) < 95) return false;
    const mins = (new Date(i.submitted_at) - new Date(i.started_at)) / 60000;
    return mins < 2 && mins >= 0;

        <button class="btn btn-ai" id="nl-ask-btn">Ask</button>
      </div>
      <div id="nl-answer" style="margin-top:10px"></div>
    </div>
    ${(risks.length || anomalies.length) ? `
    <div class="card">
      <div style="font-weight:700;margin-bottom:8px">Risk & Anomaly Insights</div>
      ${risks.map(r => `<div style="padding:8px 0;border-top:1px solid var(--line);font-size:13px"><i data-lucide="trending-down" style="width:13px;height:13px;color:var(--fail);vertical-align:-2px"></i> <a href="#/inspection/${r.id}" style="color:var(--navy);font-weight:600">${esc(r.template)} — ${esc(r.site)}</a> trending down: ${r.prev}% → ${r.latest}%</div>`).join("")}
      ${anomalies.map(a => `<div style="padding:8px 0;border-top:1px solid var(--line);font-size:13px"><i data-lucide="alert-circle" style="width:13px;height:13px;color:var(--amber-mid);vertical-align:-2px"></i> <a href="#/inspection/${a.id}" style="color:var(--navy);font-weight:600">${esc(a.templates?.code)} — ${esc(a.sites?.name)}</a> completed in under 2 minutes with a ${Math.round(a.score_pct)}% score — worth a spot-check</div>`).join("")}
    </div>` : ""}
    <div class="toolbar">

  shell("/", "Dashboard", topRight, statsHtml);
  if (window.lucide) lucide.createIcons();

  $("#nl-ask-btn").onclick = async () => {
    const q = $("#nl-question").value.trim();

    const el = $("#insp-results");

async function renderInspection(id) {

    .eq("id", id).single();
  if (!insp) { shell("/", "Inspection", "", `<div class="card">Inspection not found.</div>`); return; }
  const { data: sections } = await sb.from("template_sections")
    .select("id,title,sort_order,template_items(id,prompt,sort_order,max_marks)")
    .eq("template_id", insp.template_id).order("sort_order");
  const ordered = (sections??[]).sort((a,b)=>a.sort_order-b.sort_order).map(s => ({...s, template_items:[...s.template_items].sort((a,b)=>a.sort_order-b.sort_order)}));
  if (insp.status !== "in_progress") { renderInspectionSummary(insp, ordered); return; }
  renderRunner(insp, ordered);
}

function renderRunner(insp, sections) {
  const scored = insp.templates.scoring_type === "scored";
  state.runnerAnswers = {}; state.runnerNotes = {}; state.runnerPhotos = {};
  state.runnerActiveSection = 0;
  const allItems = sections.flatMap(s => s.template_items);
  allItems.forEach(it => state.runnerAnswers[it.id] = scored ? it.max_marks : null);
  const maxMarks = allItems.reduce((n,it)=>n+(it.max_marks??0),0);

  function headerRight() {
    const liveAtt = allItems.reduce((n,it)=>n+(state.runnerAnswers[it.id]||0),0);
    const answered = allItems.filter(it => state.runnerAnswers[it.id] !== null).length;
    return scored
      ? `<div style="text-align:right"><div style="font-size:20px;font-weight:800;color:var(--navy)">${liveAtt}<span style="color:var(--sub);font-size:12px"> /${maxMarks}</span></div><div style="font-size:11px;font-weight:600;color:var(--sub)">${Math.round((liveAtt/maxMarks)*100)}%</div></div>`
      : `<div style="text-align:right"><div style="font-size:20px;font-weight:800;color:var(--navy)">${answered}<span style="color:var(--sub);font-size:12px"> /${allItems.length}</span></div><div style="font-size:11px;font-weight:600;color:var(--sub)">ANSWERED</div></div>`;
  }

  function sectionHasFailure(s) {
    return s.template_items.some(it => {
      const v = state.runnerAnswers[it.id];
      return scored ? v < it.max_marks : v === "fail";
    });
  }

  function tabBar() {
    return `<div style="display:flex;gap:6px;flex-wrap:wrap;padding:12px 0 4px;margin-bottom:2px">
      ${sections.map((s,i) => {
        const active = i === state.runnerActiveSection;
        const flagged = sectionHasFailure(s);
        return `<button data-tab="${i}" style="padding:8px 14px;border-radius:8px;border:1px solid ${active?"var(--navy)":"var(--line)"};background:${active?"var(--navy)":"#fff"};color:${active?"#fff":"var(--ink)"};font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;position:relative">
          ${esc(s.title)}${flagged?` <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${active?"#fff":"var(--fail)"};margin-left:4px"></span>`:""}
        </button>`;
      }).join("")}
    </div>`;
  }

  function itemRow(it) {
    const val = state.runnerAnswers[it.id];
    const failed = scored ? val < it.max_marks : val === "fail";
    const notes = state.runnerNotes[it.id] || "";
    const photos = state.runnerPhotos[it.id] || [];
    const controls = scored
      ? `<div style="display:flex;align-items:center;gap:8px">
          <button class="step-btn" data-act="dec" data-id="${it.id}">−</button>
          <span style="font-weight:800;font-size:13.5px;min-width:44px;text-align:center;color:${failed?"var(--fail)":"var(--pass)"}">${val}<span style="color:var(--sub);font-weight:600"> /${it.max_marks}</span></span>
          <button class="step-btn" data-act="inc" data-id="${it.id}" data-max="${it.max_marks}">+</button>
        </div>`
      : `<div style="display:flex;gap:6px">${["ok","fail","na"].map(v=>`<button class="tri-btn ${val===v?"on-"+v:""}" data-act="tri" data-id="${it.id}" data-v="${v}">${v==="ok"?"✓":v==="fail"?"✕":"N/A"}</button>`).join("")}</div>`;
    const findingArea = failed ? `
      <div style="margin-top:8px">
        <input type="text" placeholder="Finding note — what was observed?" data-note="${it.id}" value="${esc(notes)}" style="margin-bottom:8px">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          ${photos.map(url => `<div style="position:relative"><img src="${url}" class="photo-thumb"><button data-rmphoto="${it.id}" data-url="${esc(url)}" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--fail);color:var(--fail);font-weight:700;font-size:11px;cursor:pointer">×</button></div>`).join("")}
          <label class="photo-tile" style="display:flex;flex-direction:column;align-items:center;gap:2px"><i data-lucide="camera" style="width:16px;height:16px"></i>Photo<input type="file" accept="image/*" capture="environment" data-photo="${it.id}" style="display:none"></label>
          ${photos.length ? `<button class="btn btn-ai btn-sm" data-analyze="${it.id}"><i data-lucide="sparkles" style="width:12px;height:12px"></i>Analyze photo</button>` : ""}
        </div>
      </div>` : "";
    return `<div class="item-row ${failed?"failed":""}">
      <div class="row" style="gap:12px"><div class="prompt">${esc(it.prompt)}</div>${controls}</div>
      ${findingArea}
    </div>`;
  }

  function renderBody() {
    const activeSection = sections[state.runnerActiveSection];
    const isLast = state.runnerActiveSection === sections.length - 1;
    const isFirst = state.runnerActiveSection === 0;
    const body = `
      <div class="sticky-runner-header">
        <div class="card" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0;border-left:4px solid var(--navy)">
          <div><div style="font-weight:800;color:var(--navy)">${esc(insp.templates.code)} — ${esc(insp.templates.name)}</div><div class="muted">${esc(insp.sites.name)}</div></div>
          ${headerRight()}
        </div>
        ${tabBar()}
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div class="section-head">${esc(activeSection.title)} <span style="opacity:.7;font-weight:500">(${state.runnerActiveSection+1} of ${sections.length})</span></div>
        ${activeSection.template_items.map(itemRow).join("")}
      </div>
      <div style="display:flex;gap:10px;margin:14px 0 90px">
        <button class="btn btn-ghost" id="prev-tab-btn" ${isFirst?"disabled":""}>&larr; Previous section</button>
        ${!isLast
          ? `<button class="btn btn-primary" id="next-tab-btn">Next section &rarr;</button>`
          : `<button class="btn btn-primary" id="submit-btn">Complete inspection</button>`}
        <span class="err" id="runner-err" style="display:none"></span>
      </div>`;
    shell("/", `${insp.templates.code} — ${insp.sites.name}`, "", body);
    wireEvents();
  }

  function wireEvents() {
    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.onclick = () => { state.runnerActiveSection = parseInt(btn.dataset.tab); renderBody(); };
    });
    const prevBtn = $("#prev-tab-btn");
    if (prevBtn) prevBtn.onclick = () => { state.runnerActiveSection = Math.max(0, state.runnerActiveSection-1); renderBody(); };
    const nextBtn = $("#next-tab-btn");
    if (nextBtn) nextBtn.onclick = () => { state.runnerActiveSection = Math.min(sections.length-1, state.runnerActiveSection+1); renderBody(); };

    document.querySelectorAll("[data-act]").forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id, act = btn.dataset.act;
        if (act==="tri") state.runnerAnswers[id] = state.runnerAnswers[id]===btn.dataset.v ? null : btn.dataset.v;
        else if (act==="inc") state.runnerAnswers[id] = Math.min(parseInt(btn.dataset.max), (state.runnerAnswers[id]||0)+1);
        else if (act==="dec") state.runnerAnswers[id] = Math.max(0, (state.runnerAnswers[id]||0)-1);
        renderBody();
      };
    });
    document.querySelectorAll("[data-note]").forEach(inp => inp.oninput = () => state.runnerNotes[inp.dataset.note] = inp.value);
    document.querySelectorAll("[data-photo]").forEach(inp => {
      inp.onchange = async () => {
        const file = inp.files[0]; if (!file) return;
        const itemId = inp.dataset.photo;
        const ext = file.name.split(".").pop() || "jpg";
        const path = `${insp.org_id}/${insp.id}/${itemId}-${Date.now()}.${ext}`;
        const { error } = await sb.storage.from("inspection-photos").upload(path, file, { contentType: file.type||"image/jpeg" });
        if (error) { $("#runner-err").style.display="block"; $("#runner-err").textContent="Photo upload failed: "+error.message; return; }
        const { data: pub } = sb.storage.from("inspection-photos").getPublicUrl(path);
        state.runnerPhotos[itemId] = [...(state.runnerPhotos[itemId]||[]), pub.publicUrl];
        renderBody();
      };
    });
    document.querySelectorAll("[data-rmphoto]").forEach(btn => {
      btn.onclick = () => { const id=btn.dataset.rmphoto; state.runnerPhotos[id]=(state.runnerPhotos[id]||[]).filter(u=>u!==btn.dataset.url); renderBody(); };
    });
    document.querySelectorAll("[data-analyze]").forEach(btn => {
      btn.onclick = async () => {
        const itemId = btn.dataset.analyze;
        const photos = state.runnerPhotos[itemId] || [];
        if (!photos.length) return;
        btn.disabled = true; btn.textContent = "Analyzing…";
        const itemText = allItems.find(it => it.id === itemId)?.prompt || "";
        const base64 = await urlToBase64(photos[0]);
        const { text, error } = await callAI("analyze_photo", { itemPrompt: itemText, imageBase64: base64, mediaType: "image/jpeg" });
        if (!error && text) {
          state.runnerNotes[itemId] = (state.runnerNotes[itemId] ? state.runnerNotes[itemId] + " " : "") + text.trim();
        }
        renderBody();
      };
    });
    const submitBtn = $("#submit-btn");
    if (submitBtn) submitBtn.onclick = submit;
  }

  async function submit() {
    $("#submit-btn").disabled = true;
    let pass=0, fail=0, na=0, att=0;
    const rows = allItems.map(it => {
      const val = state.runnerAnswers[it.id];
      const photoUrls = state.runnerPhotos[it.id] || [];
      if (scored) { att += val; return { inspection_id: insp.id, item_id: it.id, marks_attained: val, note: state.runnerNotes[it.id]||null, photo_urls: photoUrls }; }
      const v = val ?? "na";
      if (v==="ok") pass++; else if (v==="fail") fail++; else na++;
      return { inspection_id: insp.id, item_id: it.id, result: v, note: state.runnerNotes[it.id]||null, photo_urls: photoUrls };
    });
    const { error: rErr } = await sb.from("inspection_responses").insert(rows);
    if (rErr) { $("#runner-err").style.display="block"; $("#runner-err").textContent=rErr.message; $("#submit-btn").disabled=false; return; }
    const scorePct = scored ? (att/maxMarks)*100 : (pass+fail===0?100:(pass/(pass+fail))*100);
    const { error: uErr } = await sb.from("inspections").update({
      status:"submitted", submitted_at:new Date().toISOString(), score_pct:Math.round(scorePct*100)/100,
      marks_attained: scored?att:null, marks_max: scored?maxMarks:null, count_pass:pass, count_fail:fail, count_na:na,
    }).eq("id", insp.id);
    if (uErr) { $("#runner-err").style.display="block"; $("#runner-err").textContent=uErr.message; $("#submit-btn").disabled=false; return; }
    location.hash = `/inspection/${insp.id}`; route();
  }
  renderBody();
}

async function renderInspectionSummary(insp, sections) {
  const { data: responses } = await sb.from("inspection_responses").select("item_id,result,marks_attained,note,photo_urls").eq("inspection_id", insp.id);
  const byItem = new Map((responses??[]).map(r=>[r.item_id,r]));
  const scored = insp.templates.scoring_type === "scored";
  const findings = [];
  for (const s of sections) for (const it of s.template_items) {
    const r = byItem.get(it.id); if (!r) continue;
    if (!scored && r.result==="fail") findings.push({section:s.title,prompt:it.prompt,note:r.note,photos:r.photo_urls||[]});
    if (scored && r.marks_attained!=null && r.marks_attained<it.max_marks) findings.push({section:s.title,prompt:it.prompt,note:r.note,lost:it.max_marks-r.marks_attained,photos:r.photo_urls||[]});
  }
  const pct = Math.round(insp.score_pct ?? 0);
  const tone = scoreTone(pct);
  const body = `
    <div class="card row" style="align-items:flex-start">
      <div class="score-ring" style="background:${tone.bg};color:${tone.fg}">${pct}%</div>
      <div style="flex:1;min-width:220px">
        <div style="font-weight:800;font-size:17px;color:var(--navy)">${esc(insp.templates.code)} — ${esc(insp.templates.name)}</div>
        <div class="muted">${esc(insp.sites.name)} · submitted ${fmtDate(insp.submitted_at)}</div>
        <div style="margin-top:8px;font-size:13.5px">${scored?`${insp.marks_attained} of ${insp.marks_max} marks`:`${insp.count_pass} acceptable · ${insp.count_fail} not acceptable · ${insp.count_na} N/A`}</div>
        <button class="btn btn-ghost btn-sm" id="dup-btn" style="margin-top:10px">Duplicate as new inspection</button>
      </div>
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:10px">Findings (${findings.length})</div>
      ${findings.length===0 ? `<div style="color:var(--pass);font-weight:600;font-size:13.5px">Clean inspection — no findings. ✓</div>` :
        findings.map(f => `<div style="padding:10px 0;border-top:1px solid var(--line)">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--sub)">${esc(f.section)}${f.lost?` · −${f.lost} mark${f.lost>1?"s":""}`:""}</div>
          <div style="font-weight:600;font-size:13.5px">${esc(f.prompt)}</div>
          ${f.note?`<div class="muted">Note: ${esc(f.note)}</div>`:""}
          ${f.photos.length?`<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">${f.photos.map(url=>`<a href="${url}" target="_blank"><img src="${url}" class="photo-thumb" style="width:80px;height:80px"></a>`).join("")}</div>`:""}
        </div>`).join("") + `<a href="#/actions" class="btn btn-primary btn-sm" style="display:inline-block;margin-top:14px">View corrective actions →</a>`
      }
    </div>
    <div class="card">
      <div class="ai-label"><i data-lucide="sparkles" style="width:12px;height:12px"></i>AI Executive Summary</div>
      <button class="btn btn-ai btn-sm" id="ai-summary-btn"><i data-lucide="sparkles" style="width:13px;height:13px"></i>Generate summary</button>
      <div id="ai-summary-result" style="margin-top:10px"></div>
    </div>`;
  shell("/", `${insp.templates.code} Summary`, "", body);
  if (window.lucide) lucide.createIcons();
  $("#dup-btn").onclick = async () => {
    const { data, error } = await sb.from("inspections").insert({ org_id: insp.org_id, template_id: insp.template_id, site_id: insp.site_id, inspector_id: state.user.id, status:"in_progress" }).select("id").single();
    if (!error) { location.hash = `/inspection/${data.id}`; route(); }
  };
  $("#ai-summary-btn").onclick = async () => {
    $("#ai-summary-btn").disabled = true;
    $("#ai-summary-result").innerHTML = `<div class="muted">Generating…</div>`;
    const { text, error } = await callAI("summarize_inspection", {
      templateName: insp.templates.name, siteName: insp.sites.name, score: pct,
      findings: findings.map(f => ({ section: f.section, item: f.prompt, note: f.note })),
    });
    if (error) { $("#ai-summary-result").innerHTML = `<div class="err">${esc(error)}</div>`; $("#ai-summary-btn").disabled = false; return; }
    $("#ai-summary-result").innerHTML = `<div class="ai-box">${esc(text).replace(/\n/g,"<br>")}</div>`;
    $("#ai-summary-btn").disabled = false;
  };
}

async function renderActions() {
  shell("/actions", "Corrective Actions", "", `<div class="spinner-text">Loading…</div>`);
  const { data: actions } = await sb.from("corrective_actions")
    .select("id,title,finding,owner_name,due_date,status,closed_at,created_at,sites(name),inspection_responses(photo_urls)")
    .order("created_at",{ascending:false});
  const list = actions ?? [];
  const open = list.filter(a=>a.status==="open"||a.status==="in_progress");
  const closed = list.filter(a=>a.status==="closed");
  const t = today();

  function actionCard(a) {
    const overdue = a.status!=="closed" && a.due_date < t;
    const border = a.status==="closed" ? "var(--pass)" : overdue ? "var(--fail)" : "var(--navy-light)";
    const rawPhotos = Array.isArray(a.inspection_responses) ? a.inspection_responses[0]?.photo_urls : a.inspection_responses?.photo_urls;
    const photo = (rawPhotos||[])[0];
    return `<div class="card" style="border-left:4px solid ${border};display:flex;gap:12px;align-items:flex-start">
      ${photo ? `<a href="${photo}" target="_blank"><img src="${photo}" class="photo-thumb" style="flex-shrink:0"></a>` : ""}
      <div style="flex:1;min-width:200px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--sub)">${esc(a.sites?.name)}</div>
        <div style="font-weight:600;font-size:13.5px">${esc(a.title)}</div>
        ${a.finding?`<div class="muted">Finding: ${esc(a.finding)}</div>`:""}
        <div style="font-size:12px;margin-top:4px;font-weight:500;color:${a.status==="closed"?"var(--pass)":overdue?"var(--fail)":"var(--sub)"}">Due ${a.due_date}${overdue?" · OVERDUE":""}${a.status==="closed"&&a.closed_at?` · Closed ${new Date(a.closed_at).toLocaleDateString()}`:""}</div>
        ${a.status!=="closed" ? `<div id="ai-suggest-${a.id}" style="margin-top:8px"></div>` : ""}
      </div>
      ${a.status!=="closed" ? `<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
            <input type="text" class="field-sm" style="width:130px;font-size:12px" placeholder="Owner" value="${esc(a.owner_name||"")}" data-owner="${a.id}">
            <input type="date" style="font-size:12px" value="${a.due_date}" data-due="${a.id}">
            <button class="btn btn-primary btn-sm" data-close="${a.id}">Close out</button>
          </div>
          <button class="btn btn-ai btn-sm" data-suggest="${a.id}"><i data-lucide="sparkles" style="width:12px;height:12px"></i>Suggest fix</button>
        </div>` : `<span class="pill pill-pass">Verified & closed</span>`}
    </div>`;
  }

  const body = `
    <p class="muted" style="margin-top:-8px">Every failed check point becomes a tracked action here automatically.</p>
    <h2 class="section-title">Open (${open.length})</h2>
    ${open.length===0?`<div class="card muted">No open actions — nice work.</div>`:open.map(actionCard).join("")}
    ${closed.length?`<h2 class="section-title">Closed (${closed.length})</h2>${closed.map(actionCard).join("")}`:""}`;
  shell("/actions", "Corrective Actions", "", body);

  document.querySelectorAll("[data-owner]").forEach(inp => inp.onblur = () => sb.from("corrective_actions").update({owner_name:inp.value}).eq("id",inp.dataset.owner));
  document.querySelectorAll("[data-due]").forEach(inp => inp.onchange = () => sb.from("corrective_actions").update({due_date:inp.value}).eq("id",inp.dataset.due));
  document.querySelectorAll("[data-close]").forEach(btn => btn.onclick = async () => { await sb.from("corrective_actions").update({status:"closed",closed_at:new Date().toISOString()}).eq("id",btn.dataset.close); renderActions(); });
  document.querySelectorAll("[data-suggest]").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.suggest;
      const a = list.find(x => x.id === id);
      btn.disabled = true; btn.textContent = "Thinking…";
      const { text, error } = await callAI("suggest_action", { section: a.title, itemPrompt: a.title, note: a.finding });
      const box = $(`#ai-suggest-${id}`);
      if (error) { box.innerHTML = `<div class="err">${esc(error)}</div>`; }
      else {
        let parsed = null;
        try { parsed = JSON.parse(text.replace(/```json|```/g,"").trim()); } catch {}
        if (parsed) {
          box.innerHTML = `<div class="ai-box"><div class="ai-label" style="margin-bottom:4px"><i data-lucide="sparkles" style="width:11px;height:11px"></i>Suggested</div>${esc(parsed.action)}${parsed.days?` <span style="color:var(--sub)">(~${parsed.days} day${parsed.days>1?"s":""})</span>`:""}</div>`;
          if (parsed.days) {
            const dueInput = document.querySelector(`[data-due="${id}"]`);
            if (dueInput) {
              const d = new Date(); d.setDate(d.getDate() + parsed.days);
              dueInput.value = d.toISOString().slice(0,10);
              sb.from("corrective_actions").update({ due_date: dueInput.value }).eq("id", id);
            }
          }
        } else {
          box.innerHTML = `<div class="ai-box">${esc(text)}</div>`;
        }
        if (window.lucide) lucide.createIcons();
      }
      btn.disabled = false; btn.innerHTML = `<i data-lucide="sparkles" style="width:12px;height:12px"></i>Suggest fix`;
      if (window.lucide) lucide.createIcons();
    };
  });
}

init();
</script>
</body>
</html>
